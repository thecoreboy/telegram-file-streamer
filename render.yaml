services:
  - type: web
    name: telegram-file-streamer
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: PORT
        value: 8000
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BIN_CHANNEL
        sync: false
      - key: BASE_URL
        sync: false
      - key: AUTH_USERS
        sync: false
      - key: SECRET_KEY
        generateValue: true
